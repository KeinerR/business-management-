<div class="table-responsive"><table class="table table-bordered"><thead class="table-light"><tr><th>Mes</th><th>Moneda</th><th class="text-end">Entradas esperadas</th><th class="text-end">Salidas esperadas</th><th class="text-end">Flujo neto</th></tr></thead><tbody>{% for row in forecast_rows %}<tr><td>{{ row.month }}</td><td>{{ row.currency }}</td><td class="text-end text-success">{{ row.incoming|floatformat:2 }}</td><td class="text-end text-danger">{{ row.outgoing|floatformat:2 }}</td><td class="text-end fw-semibold {% if row.net < 0 %}text-danger{% else %}text-success{% endif %}">{{ row.net|floatformat:2 }}</td></tr>{% empty %}<tr><td colspan="5" class="text-center text-muted">No hay cartera con vencimiento en este periodo.</td></tr>{% endfor %}</tbody></table></div>
