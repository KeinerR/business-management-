{% extends "tenant/base.html" %}
{% block title %}{{ page_title }} | System Manager{% endblock %}
{% block workspace_content %}
<div class="container py-3" style="max-width:720px">
  <h2 class="h4 mb-3">{{ page_title }}</h2>
  <form method="post" class="panel-card">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
      </div>
    {% endfor %}
    <button class="btn btn-primary" type="submit">Guardar etiqueta</button>
    <a class="btn btn-outline-secondary" href="{% url 'document_tag_list' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
