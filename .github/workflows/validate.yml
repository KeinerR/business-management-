name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: systemmanager
          POSTGRES_USER: systemmanager
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U systemmanager -d systemmanager"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-key-not-for-deployment
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,tenant.test.com,testserver
      DB_NAME: systemmanager
      DB_USER: systemmanager
      DB_PASSWORD: ci-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate_schemas --noinput
      - run: python manage.py test businessmanagement --noinput
      - run: DJANGO_USE_WHITENOISE=True python manage.py collectstatic --noinput
      - run: docker build -t systemmanager:ci .
